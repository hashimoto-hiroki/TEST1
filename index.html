<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カ or 力 ゲーム</title>
<style>
    body {
        margin: 0;
        font-family: sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 95%;
        max-width: 500px;
        background: white;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        text-align: center;
    }

    h1 {
        margin-top: 0;
        font-size: 2rem;
    }

    #character {
        font-size: 10rem;
        margin: 30px 0;
        user-select: none;
        transition: transform 0.1s;
    }

    .buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }

    button {
        font-size: 1.5rem;
        padding: 15px 30px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: scale(1.05);
    }

    .ka {
        background: #4caf50;
        color: white;
    }

    .power {
        background: #2196f3;
        color: white;
    }

    #info {
        margin-top: 25px;
        font-size: 1.2rem;
        line-height: 1.8;
    }

    #result {
        font-size: 2rem;
        margin-top: 10px;
        height: 45px;
    }

    #startBtn {
        margin-top: 20px;
        background: #ff9800;
</html>
