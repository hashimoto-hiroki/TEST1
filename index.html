<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>音の高さグラフ</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    text-align:center;
    font-family:sans-serif;
}

canvas{
    background:black;
    border:1px solid white;
    margin-top:20px;
}
</style>
</head>
<body>

<h1>リアルタイム音程グラフ</h1>
<button id="startBtn">開始</button>

<br>

<canvas id="canvas" width="800" height="400"></canvas>

<p id="freq">周波数: -- Hz</p>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const freqText = document.getElementById("freq");

let audioContext;
let analyser;
let dataArray;

async function startAudio(){

    const stream = await navigator.mediaDevices.getUserMedia({
        audio:true
    });

    audioContext = new AudioContext();

    const source =
        audioContext.createMediaStreamSource(stream);

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    dataArray = new Float32Array(analyser.fftSize);

    draw();
}

function autoCorrelate(buffer, sampleRate){

    let SIZE = buffer.length;
    let rms = 0;

    for(let i=0;i<SIZE;i++){
        let val = buffer[i];
        rms += val * val;
    }

    rms = Math.sqrt(rms / SIZE);

    if(rms < 0.01) return -1;

    let r1 = 0;
    let r2 = SIZE - 1;

    for(let i=0;i<SIZE/2;i++){
        if(Math.abs(buffer[i]) < 0.2){
            r1 = i;
            break;
        }
    }

    for(let i=1;i<SIZE/2;i++){
        if(Math.abs(buffer[SIZE-i]) < 0.2){
            r2 = SIZE-i;
            break;
        }
    }

    buffer = buffer.slice(r1, r2);
    SIZE = buffer.length;

    let c = new Array(SIZE).fill(0);

    for(let i=0;i<SIZE;i++){
        for(let j=0;j<SIZE-i;j++){
            c[i] += buffer[j] * buffer[j+i];
        }
    }

    let d = 0;
    while(c[d] > c[d+1]) d++;

    let maxpos = -1;
    let maxval = -1;

    for(let i=d;i<SIZE;i++){
        if(c[i] > maxval){
            maxval = c[i];
            maxpos = i;
        }
    }

    let T0 = maxpos;

    return sampleRate / T0;
}

let history = [];

function draw(){

    requestAnimationFrame(draw);

    analyser.getFloatTimeDomainData(dataArray);

    let freq = autoCorrelate(
        dataArray,
        audioContext.sampleRate
    );

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(freq !== -1){

        freqText.textContent =
            "周波数: " + freq.toFixed(1) + " Hz";

        history.push(freq);

        if(history.length > canvas.width){
            history.shift();
        }

        ctx.beginPath();

        for(let i=0;i<history.length;i++){

            let y =
                canvas.height -
                (history[i] / 1000) * canvas.height;

            if(i===0){
                ctx.moveTo(i,y);
            }else{
                ctx.lineTo(i,y);
            }
        }

        ctx.strokeStyle = "lime";
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

document.getElementById("startBtn")
.onclick = startAudio;

</script>

</body>
</html>
