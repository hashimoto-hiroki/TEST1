<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棒人間ゲーム</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#dff3ff;
    touch-action:none;
    font-family:sans-serif;
}

canvas{
    display:block;
    background:linear-gradient(#b9e8ff,#ffffff);
}

#timer{
    position:fixed;
    top:10px;
    right:20px;
    font-size:32px;
    font-weight:bold;
    z-index:10;
}

#controls{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;

    display:flex;
    justify-content:space-between;

    padding:15px;
    box-sizing:border-box;
}

.side{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.ctrl{

    width:120px;
    height:90px;

    border:none;
    border-radius:18px;

    background:#222;
    color:white;

    font-size:18px;
}

.ctrl:active{
    transform:scale(0.95);
}

#startScreen,
#goalScreen{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.45);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:20;
}

#goalScreen{
    display:none;
}

.bigBtn{

    padding:20px 50px;

    border:none;
    border-radius:20px;

    background:#222;
    color:white;

    font-size:42px;
}

#goalText{

    color:white;
    font-size:54px;

    margin-bottom:25px;
    text-align:center;
}

</style>
</head>
<body>

<div id="timer">0.00</div>

<div id="startScreen">
    <button class="bigBtn" id="startBtn">START</button>
</div>

<div id="goalScreen">
    <div id="goalText"></div>
    <button class="bigBtn" id="restartBtn">RESTART</button>
</div>

<canvas id="game"></canvas>

<div id="controls">

    <div class="side">
        <button class="ctrl" id="leftCW">左 ↻</button>
        <button class="ctrl" id="leftCCW">左 ↺</button>
    </div>

    <div class="side">
        <button class="ctrl" id="rightCW">右 ↻</button>
        <button class="ctrl" id="rightCCW">右 ↺</button>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resize();

addEventListener("resize", resize);

const GROUND = () => canvas.height - 160;

const GOAL_X = 3500;

// 下方向重力なし
const GRAVITY = 0;

const LEG_LEN = 90;

let running = false;
let finished = false;

let startTime = 0;

const player = {

    x:200,
    y:canvas.height/2,

    vx:0,
    vy:0,

    rot:0,
    rotV:0
};

function makeLeg(){

    return {

        angle:0,

        angVel:0,

        gravityVel:0,

        footX:0,
        footY:0,

        grounded:false
    };
}

const leftLeg = makeLeg();
const rightLeg = makeLeg();

function resetGame(){

    player.x = 200;
    player.y = canvas.height/2;

    player.vx = 0;
    player.vy = 0;

    player.rot = 0;
    player.rotV = 0;

    Object.assign(leftLeg, makeLeg());
    Object.assign(rightLeg, makeLeg());

    finished = false;
    running = false;

    document.getElementById("timer").textContent = "0.00";

    document.getElementById("goalScreen").style.display = "none";
    document.getElementById("startScreen").style.display = "flex";
}

function applyLegForce(leg, dir){

    if(!running || finished) return;

    const torque = 0.08;

    if(dir === "cw"){

        leg.angVel += torque;

    }else{

        leg.angVel -= torque;
    }

    // 身体への反作用
    player.rotV +=
        (dir === "cw") ? -0.01 : 0.01;
}

function bind(id, leg, dir){

    document.getElementById(id)
    .addEventListener("pointerdown", ()=>{

        applyLegForce(leg, dir);
    });
}

bind("leftCW", leftLeg, "cw");
bind("leftCCW", leftLeg, "ccw");

bind("rightCW", rightLeg, "cw");
bind("rightCCW", rightLeg, "ccw");

function updateLeg(leg){

    // 空気抵抗
    leg.angVel *= 0.97;

    // 足の重力
    const gravityTorque =
        -Math.sin(leg.angle) * 0.015;

    leg.gravityVel += gravityTorque;

    leg.gravityVel *= 0.96;

    leg.angVel += leg.gravityVel;

    // 回転
    leg.angle += leg.angVel;

    // 足位置
    leg.footX =
        Math.sin(leg.angle) * LEG_LEN;

    leg.footY =
        Math.cos(leg.angle) * LEG_LEN;

    // 接地判定
    const footWorldY =
        player.y + 40 + leg.footY;

    leg.grounded =
        footWorldY >= GROUND();

    // 接地
    if(leg.grounded){

        // 摩擦
        const grip = 0.82;

        const groundPush =
            -leg.angVel * grip;

        // 推進力
        player.vx += groundPush * 1.8;

        // 身体回転
        player.rotV += groundPush * 0.018;

        // 足摩擦
        leg.angVel *= 0.88;

        // 重力減衰
        leg.gravityVel *= 0.7;
    }
}

function updatePhysics(){

    // 重力なし
    player.vy += GRAVITY;

    // 移動
    player.x += player.vx;
    player.y += player.vy;

    // 回転
    player.rot += player.rotV;

    // 空気抵抗
    player.vx *= 0.992;
    player.vy *= 0.995;
    player.rotV *= 0.985;

    // 地面摩擦
    const grounded =
        leftLeg.grounded ||
        rightLeg.grounded;

    if(grounded){

        player.vx *= 0.94;

    }else{

        player.vx *= 0.995;
    }

    // 回転制限
    if(player.rot > 1.6){

        player.rot = 1.6;
        player.rotV *= -0.3;
    }

    if(player.rot < -1.6){

        player.rot = -1.6;
        player.rotV *= -0.3;
    }
}

function update(){

    if(running && !finished){

        const t =
            (performance.now()-startTime)/1000;

        document.getElementById("timer")
            .textContent = t.toFixed(2);

        updateLeg(leftLeg);
        updateLeg(rightLeg);

        updatePhysics();

        if(player.x >= GOAL_X){

            finished = true;
            running = false;

            document.getElementById("goalScreen")
                .style.display = "flex";

            document.getElementById("goalText")
                .innerHTML =
                "GOAL!<br>" +
                t.toFixed(2) +
                " 秒";
        }
    }
}

function drawLeg(leg){

    ctx.beginPath();

    ctx.moveTo(0,40);

    ctx.lineTo(
        leg.footX,
        40 + leg.footY
    );

    ctx.stroke();
}

function drawPlayer(){

    ctx.save();

    ctx.translate(player.x, player.y);

    // 身体回転
    ctx.rotate(player.rot);

    ctx.strokeStyle = "black";
    ctx.lineWidth = 7;

    // 頭
    ctx.beginPath();
    ctx.arc(0,-70,24,0,Math.PI*2);
    ctx.stroke();

    // 胴体
    ctx.beginPath();
    ctx.moveTo(0,-46);
    ctx.lineTo(0,40);
    ctx.stroke();

    // 腕
    ctx.beginPath();
    ctx.moveTo(-35,-10);
    ctx.lineTo(35,-10);
    ctx.stroke();

    // 足
    drawLeg(leftLeg);
    drawLeg(rightLeg);

    ctx.restore();
}

// 地面描画なし
function drawGround(){

}

function drawGoal(){

    ctx.fillStyle = "black";

    ctx.fillRect(
        GOAL_X,
        canvas.height/2 - 120,
        8,
        200
    );

    ctx.fillStyle = "red";

    ctx.beginPath();

    ctx.moveTo(GOAL_X+8, canvas.height/2 - 120);
    ctx.lineTo(GOAL_X+80, canvas.height/2 - 90);
    ctx.lineTo(GOAL_X+8, canvas.height/2 - 60);

    ctx.fill();
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGround();
    drawGoal();
    drawPlayer();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

document.getElementById("startBtn")
.onclick = ()=>{

    running = true;

    startTime = performance.now();

    document.getElementById("startScreen")
        .style.display = "none";
};

document.getElementById("restartBtn")
.onclick = ()=>{

    resetGame();
};

resetGame();

</script>

</body>
</html>
