<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リアルタイム音程グラフ</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    text-align:center;
    font-family:sans-serif;
}

canvas{
    background:black;
    border:1px solid white;
    margin-top:20px;
}

button{
    font-size:20px;
    padding:10px 20px;
    margin-top:20px;
}

#freq{
    font-size:24px;
}
</style>
</head>
<body>

<h1>リアルタイム音程グラフ</h1>

<button id="startBtn">開始</button>

<br>

<canvas id="canvas" width="900" height="400"></canvas>

<p id="freq">周波数: -- Hz</p>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const freqText = document.getElementById("freq");

let audioContext;
let analyser;
let dataArray;

let history = [];

// 初期値を中央ラインにする
for(let i=0;i<canvas.width;i++){
    history.push(0);
}

async function startAudio(){

    const stream = await navigator.mediaDevices.getUserMedia({
        audio:true
    });

    audioContext = new AudioContext();

    const source =
        audioContext.createMediaStreamSource(stream);

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    dataArray = new Float32Array(analyser.fftSize);

    draw();
}

function autoCorrelate(buffer, sampleRate){

    let SIZE = buffer.length;
    let rms = 0;

    for(let i=0;i<SIZE;i++){
        let val = buffer[i];
        rms += val * val;
    }

    rms = Math.sqrt(rms / SIZE);

    // 無音判定
    if(rms < 0.01) return -1;

    let r1 = 0;
    let r2 = SIZE - 1;

    for(let i=0;i<SIZE/2;i++){
        if(Math.abs(buffer[i]) < 0.2){
            r1 = i;
            break;
        }
    }

    for(let i=1;i<SIZE/2;i++){
        if(Math.abs(buffer[SIZE-i]) < 0.2){
            r2 = SIZE-i;
            break;
        }
    }

    buffer = buffer.slice(r1, r2);
    SIZE = buffer.length;

    let c = new Array(SIZE).fill(0);

    for(let i=0;i<SIZE;i++){
        for(let j=0;j<SIZE-i;j++){
            c[i] += buffer[j] * buffer[j+i];
        }
    }

    let d = 0;

    while(c[d] > c[d+1]) d++;

    let maxpos = -1;
    let maxval = -1;

    for(let i=d;i<SIZE;i++){
        if(c[i] > maxval){
            maxval = c[i];
            maxpos = i;
        }
    }

    let T0 = maxpos;

    return sampleRate / T0;
}

function draw(){

    requestAnimationFrame(draw);

    analyser.getFloatTimeDomainData(dataArray);

    let freq = autoCorrelate(
        dataArray,
        audioContext.sampleRate
    );

    // 無音時は0Hzとして扱う
    if(freq === -1){
        freq = 0;
        freqText.textContent = "周波数: 0 Hz";
    }else{
        freqText.textContent =
            "周波数: " + freq.toFixed(1) + " Hz";
    }

    history.push(freq);

    if(history.length > canvas.width){
        history.shift();
    }

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 中央ライン
    ctx.strokeStyle = "#444";
    ctx.beginPath();
    ctx.moveTo(0, canvas.height - 1);
    ctx.lineTo(canvas.width, canvas.height - 1);
    ctx.stroke();

    // グラフ描画
    ctx.beginPath();

    for(let i=0;i<history.length;i++){

        let y;

        if(history[i] === 0){

            // 無音時は下に表示
            y = canvas.height - 5;

        }else{

            y =
                canvas.height -
                (history[i] / 1000) * canvas.height;

            if(y < 0) y = 0;
        }

        if(i === 0){
            ctx.moveTo(i,y);
        }else{
            ctx.lineTo(i,y);
        }
    }

    ctx.strokeStyle = "lime";
    ctx.lineWidth = 2;
    ctx.stroke();
}

document.getElementById("startBtn")
.onclick = startAudio;

</script>

</body>
</html>
